name: Quality Gates

on:
  pull_request:
    paths:
      - "configs/canonical/**"
      - "src/pipelines/run.py"
      - "scripts/ci_validate_canonical_configs.py"
      - "scripts/ci_validate_runner_contract.py"
      - ".github/workflows/quality-gates.yml"
  push:
    branches: [ "main", "master" ]
    paths:
      - "configs/canonical/**"
      - "src/pipelines/run.py"
      - "scripts/ci_validate_canonical_configs.py"
      - "scripts/ci_validate_runner_contract.py"
      - ".github/workflows/quality-gates.yml"

jobs:
  config-and-runner-contract:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Validate canonical config contract
        run: python scripts/ci_validate_canonical_configs.py

      - name: Validate runner artifact contract hooks
        run: python scripts/ci_validate_runner_contract.py

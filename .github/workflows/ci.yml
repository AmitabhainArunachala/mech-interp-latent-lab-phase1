name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.11', '3.12', '3.13']

    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
    
    - name: Lint with flake8 (if available)
      run: |
        if pip show flake8 > /dev/null 2>&1; then
          # Stop the build if there are Python syntax errors or undefined names
          flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics
          # Exit-zero treats all errors as warnings
          flake8 . --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics
        else
          echo "flake8 not installed, skipping linting"
        fi
    
    - name: Check code formatting with black (if available)
      run: |
        if pip show black > /dev/null 2>&1; then
          black --check .
        else
          echo "black not installed, skipping formatting check"
        fi
    
    - name: Type check with mypy (if available)
      run: |
        if pip show mypy > /dev/null 2>&1; then
          mypy src/ --ignore-missing-imports || true
        else
          echo "mypy not installed, skipping type checking"
        fi
    
    - name: Verify requirements files exist
      run: |
        test -f requirements.txt
        test -f requirements.lock
    
    - name: Basic import test
      run: |
        python -c "import sys; print(f'Python {sys.version}')"
        python -c "import torch; print(f'PyTorch {torch.__version__}')"
        python -c "import transformers; print(f'Transformers {transformers.__version__}')"

  security:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install safety
    
    - name: Run safety check
      run: |
        safety check -r requirements.txt --continue-on-error || true
